<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnóstico de cámaras MGP</title>

<style>
body {
  font-family: Arial, sans-serif;
  padding: 20px;
}

button {
  display: block;
  width: 100%;
  padding: 14px;
  margin: 10px 0;
  font-size: 16px;
}

video {
  width: 100%;
  max-width: 500px;
  background: #000;
}

pre {
  white-space: pre-wrap;
  background: #eee;
  padding: 15px;
}
</style>
</head>

<body>

<h2>📷 Diagnóstico de cámaras</h2>

<button id="frontal">
📱 Probar cámara frontal
</button>

<button id="trasera">
📷 Probar cámara trasera
</button>

<button id="detener">
⏹ Detener cámara
</button>

<video id="video" autoplay playsinline></video>

<pre id="resultado">
Esperando prueba...
</pre>


<script>

let streamActual = null;

const video =
  document.getElementById('video');

const resultado =
  document.getElementById('resultado');


// =====================================================
// MOSTRAR INFORMACIÓN DE LA CÁMARA
// =====================================================

function mostrarInformacion(
  titulo,
  stream
) {

  const tracks =
    stream.getVideoTracks();

  if (!tracks.length) {

    resultado.textContent =
      '❌ No existe pista de vídeo.';

    return;

  }

  const track =
    tracks[0];

  const settings =
    track.getSettings();

  const capabilities =
    track.getCapabilities
      ? track.getCapabilities()
      : {};

  resultado.textContent =
`===== ${titulo} =====

label:
${track.label}

deviceId:
${settings.deviceId || '(no disponible)'}

facingMode:
${settings.facingMode || '(no informado)'}

width:
${settings.width || '(no informado)'}

height:
${settings.height || '(no informado)'}

frameRate:
${settings.frameRate || '(no informado)'}

capabilities:
${JSON.stringify(
  capabilities,
  null,
  2
)}
`;

}


// =====================================================
// DETENER
// =====================================================

function detener() {

  if (streamActual) {

    streamActual
      .getTracks()
      .forEach(function(track) {

        track.stop();

      });

    streamActual =
      null;

  }

  video.srcObject =
    null;

}


// =====================================================
// PROBAR CÁMARA
// =====================================================

async function probar(
  modo,
  titulo
) {

  detener();

  resultado.textContent =
    '🔍 Solicitando ' +
    titulo +
    '...';


  try {

    const stream =
      await navigator.mediaDevices
        .getUserMedia({

          video: {

            facingMode: {
              exact: modo
            }

          },

          audio: false

        });


    streamActual =
      stream;


    video.srcObject =
      stream;


    mostrarInformacion(
      titulo,
      stream
    );

  }
  catch (error) {

    resultado.textContent =
`❌ ERROR

Nombre:
${error.name}

Mensaje:
${error.message}

Modo solicitado:
${modo}
`;

    console.error(
      error
    );

  }

}


// =====================================================
// BOTONES
// =====================================================

document
  .getElementById('frontal')
  .addEventListener(
    'click',
    function() {

      probar(
        'user',
        'CÁMARA FRONTAL'
      );

    }
  );


document
  .getElementById('trasera')
  .addEventListener(
    'click',
    function() {

      probar(
        'environment',
        'CÁMARA TRASERA'
      );

    }
  );


document
  .getElementById('detener')
  .addEventListener(
    'click',
    detener
  );

</script>

</body>
</html>
